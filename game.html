<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>After-School Detention Escape</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia|Audiowide">
    <script src="script.js" defer></script>

    <style>
        /* 2. CSS FONT RULES GO HERE INSIDE <STYLE> */
        body {
            font-family: "Sofia", sans-serif;
        }
        header h1, button {
            font-family: "Audiowide", sans-serif;
        }
        /* ... rest of your CSS code ... */
    </style>
</head>

<body>
    <header>
        <h1>After-School Detention Escape</h1>
        <p>Find the trophy. Avoid detention. Make it out.</p>
    </header>

    <main>
        <section class="status-panel" aria-label="Player status">
            <p>Suspicion: <strong id="health-display">0</strong>/100</p>
            <p>Inventory: <strong id="inventory-display">Empty</strong></p>
        </section>

        <section class="story-panel" aria-live="polite">
            <p class="eyebrow">YOUR STORY</p>
            <h2 id="scene-title"></h2>
            <h3 id="character-name"></h3>
            <p id="scene-text"></p>
            <div id="choices-container" class="choices"></div>
            <p id="message-display" role="status"></p>
        </section>

        <button id="restart-button" class="restart-button" type="button">
            Restart Escape
        </button>
    </main>

    <footer>
        <p>Science Olympiad needs you. Choose carefully.</p>
    </footer>
</body>

</html>
